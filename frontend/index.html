<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F1" />
    <!--
      탭 아이콘. 앱 첫 화면(스플래시)의 핀과 같은 그림이다.
      도형 원본은 src/components/splash/brandPinGeometry.ts에 있다.
    -->
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!--
      검색 결과와 링크 공유에 쓰이는 정보.

      title에 서비스 이름만 있으면 검색 결과에 "혼자왔니" 한 줄만 뜨고,
      무엇을 하는 곳인지 알 수 없어 클릭할 이유가 없다. description도 없으면
      검색엔진이 본문에서 아무 문장이나 끌어다 쓴다.

      og:* 는 카카오톡·SNS로 링크를 공유할 때 뜨는 미리보기다. 없으면 주소만
      덩그러니 나온다. 축제 현장에서 링크를 주고받는 서비스라 영향이 크다.

      ⚠ 여기 있는 값은 모든 화면에 똑같이 적용된다. SPA라 축제 상세 같은 개별
        페이지마다 다른 제목·설명을 주려면 별도 처리가 필요하다.
    -->
    <title>혼자왔니 — 혼자 여행, 축제에서 만나는 동행</title>
    <meta
      name="description"
      content="강원도 축제에 혼자 왔나요? 현장에서 체크인하면 2~4인 소그룹으로 즉석 매칭해 드려요. 매칭이 어려우면 주변 관광지를 묶은 솔로 코스를 추천합니다."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="혼자왔니" />
    <meta property="og:title" content="혼자왔니 — 혼자 여행, 축제에서 만나는 동행" />
    <meta
      property="og:description"
      content="강원도 축제에 혼자 왔나요? 현장에서 체크인하면 2~4인 소그룹으로 즉석 매칭해 드려요."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="혼자왔니 — 혼자 여행, 축제에서 만나는 동행" />
    <meta
      name="twitter:description"
      content="강원도 축제에 혼자 왔나요? 현장에서 체크인하면 2~4인 소그룹으로 즉석 매칭해 드려요."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      검색엔진 소유 확인 태그.

      비밀이 아니다. 사이트 소스를 열면 누구나 보이는 값이고, "이 사이트의 주인이
      맞다"를 증명하는 용도일 뿐이다.

      확인이 끝난 뒤에도 지우지 않는다. 지우면 소유 확인이 풀려서 검색 콘솔의
      데이터를 못 보게 된다.

      국내 서비스라 네이버 등록이 중요하다. 네이버는 등록하지 않으면 검색에 거의
      잡히지 않는다. 구글은 등록 없이도 찾아오지만, 등록하면 색인이 빨라지고
      어떤 검색어로 들어오는지 볼 수 있다.
    -->
    <meta name="naver-site-verification" content="fd4441d296ba04509e1aa72843ea13dc0392bd58" />
    <meta name="google-site-verification" content="xLhVj7k6p_GvcHbE0kPcPA9J6i12vL5zp5uAyW4j-AY" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
