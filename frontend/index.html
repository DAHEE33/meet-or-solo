<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F1" />
    <link rel="icon" href="/icons/placeholder.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!--
      검색 결과와 링크 공유에 쓰이는 정보.

      title에 서비스 이름만 있으면 검색 결과에 "meet·or·solo" 한 줄만 뜨고,
      무엇을 하는 곳인지 알 수 없어 클릭할 이유가 없다. description도 없으면
      검색엔진이 본문에서 아무 문장이나 끌어다 쓴다.

      og:* 는 카카오톡·SNS로 링크를 공유할 때 뜨는 미리보기다. 없으면 주소만
      덩그러니 나온다. 축제 현장에서 링크를 주고받는 서비스라 영향이 크다.

      ⚠ 여기 있는 값은 모든 화면에 똑같이 적용된다. SPA라 축제 상세 같은 개별
        페이지마다 다른 제목·설명을 주려면 별도 처리가 필요하다.
    -->
    <title>meet·or·solo — 혼자 여행, 축제에서 만나는 동행</title>
    <meta
      name="description"
      content="강원도 축제에 혼자 왔나요? 현장에서 체크인하면 2~4인 소그룹으로 즉석 매칭해 드려요. 매칭이 어려우면 주변 관광지를 묶은 솔로 코스를 추천합니다."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="meet·or·solo" />
    <meta property="og:title" content="meet·or·solo — 혼자 여행, 축제에서 만나는 동행" />
    <meta
      property="og:description"
      content="강원도 축제에 혼자 왔나요? 현장에서 체크인하면 2~4인 소그룹으로 즉석 매칭해 드려요."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="meet·or·solo — 혼자 여행, 축제에서 만나는 동행" />
    <meta
      name="twitter:description"
      content="강원도 축제에 혼자 왔나요? 현장에서 체크인하면 2~4인 소그룹으로 즉석 매칭해 드려요."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
