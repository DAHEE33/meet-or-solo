# 운영 compose 내부 nginx 설정.
#
# 이 파일은 TLS를 다루지 않는다. 인증서는 Oracle VM에 직접 설치된 "호스트 nginx"가 끊고
# `127.0.0.1:28080`으로 넘긴다(`infra/nginx/host-https.prod.conf.example`).
# 즉 요청은 항상 두 개의 nginx를 지난다. **둘 다** 고쳐야 하는 항목이 있다.
#
#   - client_max_body_size : 둘 중 작은 쪽이 업로드 상한이 된다
#   - /ws Upgrade header   : 한쪽이라도 빠지면 handshake가 400이다
#   - proxy_read_timeout   : 짧은 쪽이 STOMP 유휴 연결을 끊는다

# 호스트 nginx가 붙여 준 X-Forwarded-Proto를 그대로 넘긴다.
#
# dev 설정은 `$scheme`을 그대로 써서 backend에 항상 "http"가 전달됐다. 요청이 실제로는
# HTTPS인데 내부 구간이 평문이라 그렇다. 앞단이 값을 주면 그 값을, 없으면 $scheme을 쓴다.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # 버전 노출을 줄인다.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 프로필 이미지 업로드 상한.
    #
    # 기본값은 1MB인데 앱은 PROFILE_IMAGE_MAX_SIZE(기본 5MB)를 허용한다. 맞추지 않으면
    # 1MB가 넘는 이미지가 nginx에서 413으로 끊겨 앱의 오류 처리에 닿지도 않는다.
    # multipart 경계·헤더 여유를 두고 앱 상한보다 조금 크게 잡는다.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSocket(STOMP) 상태 동기화 전용 경로다. 자유 채팅이 아니다.
    # `location /`보다 먼저 선언해야 한다. 아래로 떨어지면 정적 파일로 처리돼 handshake가 깨진다.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # STOMP heartbeat는 10초지만, 유휴 연결이 기본 60초에 끊기지 않도록 넉넉히 둔다.
        # 호스트 nginx에도 같은 값을 둬야 의미가 있다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Service Worker는 캐시되면 새 배포가 반영되지 않는다.
    # 앱 자산은 파일명에 해시가 붙지만 sw.js와 index.html은 이름이 고정이다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
