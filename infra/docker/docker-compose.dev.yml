name: meet-or-solo-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meet-or-solo-postgres-dev
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
      PGTZ: ${PGTZ:-Asia/Seoul}
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - meet-or-solo-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:17-jre-jammy
    container_name: meet-or-solo-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY}
      SERVER_PORT: ${SERVER_PORT}
      TZ: ${TZ:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_REPORT_CURSOR_HMAC_SECRET: ${ADMIN_REPORT_CURSOR_HMAC_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRES_MINUTES: ${JWT_REFRESH_TOKEN_EXPIRES_MINUTES}
      OCI_OBJECT_STORAGE_ENDPOINT: ${OCI_OBJECT_STORAGE_ENDPOINT}
      OCI_OBJECT_STORAGE_REGION: ${OCI_OBJECT_STORAGE_REGION}
      OCI_OBJECT_STORAGE_ACCESS_KEY: ${OCI_OBJECT_STORAGE_ACCESS_KEY}
      OCI_OBJECT_STORAGE_SECRET_KEY: ${OCI_OBJECT_STORAGE_SECRET_KEY}
      OCI_OBJECT_STORAGE_BUCKET: ${OCI_OBJECT_STORAGE_BUCKET}
      OCI_OBJECT_STORAGE_PROFILE_PREFIX: ${OCI_OBJECT_STORAGE_PROFILE_PREFIX}
      PROFILE_IMAGE_MAX_SIZE: ${PROFILE_IMAGE_MAX_SIZE:-5MB}
      TOURISM_API_KEY: ${TOURISM_API_KEY}
      TOUR_API_BASE_URL: ${TOUR_API_BASE_URL:-https://apis.data.go.kr/B551011/KorService2}
      TOUR_API_MOBILE_OS: ${TOUR_API_MOBILE_OS:-ETC}
      TOUR_API_MOBILE_APP: ${TOUR_API_MOBILE_APP:-SoloIn}
      TOUR_API_CONNECT_TIMEOUT: ${TOUR_API_CONNECT_TIMEOUT:-3s}
      TOUR_API_READ_TIMEOUT: ${TOUR_API_READ_TIMEOUT:-10s}
      FESTIVAL_SYNC_ENABLED: ${FESTIVAL_SYNC_ENABLED:-true}
      FESTIVAL_SYNC_INITIAL_DELAY: ${FESTIVAL_SYNC_INITIAL_DELAY:-10s}
      FESTIVAL_SYNC_FIXED_DELAY: ${FESTIVAL_SYNC_FIXED_DELAY:-6h}
      FESTIVAL_SYNC_PAGE_SIZE: ${FESTIVAL_SYNC_PAGE_SIZE:-100}
      FESTIVAL_SYNC_MAX_PAGES: ${FESTIVAL_SYNC_MAX_PAGES:-100}
      FESTIVAL_SYNC_LOOKBACK_DAYS: ${FESTIVAL_SYNC_LOOKBACK_DAYS:-30}
      FESTIVAL_SYNC_LOOKAHEAD_DAYS: ${FESTIVAL_SYNC_LOOKAHEAD_DAYS:-365}
      FESTIVAL_SYNC_REGION_CODE: ${FESTIVAL_SYNC_REGION_CODE:-51}
      FESTIVAL_SYNC_CLASSIFICATION_SYSTEM_1: ${FESTIVAL_SYNC_CLASSIFICATION_SYSTEM_1:-EV}
      FESTIVAL_SYNC_CLASSIFICATION_SYSTEM_2: ${FESTIVAL_SYNC_CLASSIFICATION_SYSTEM_2:-EV01}
      FESTIVAL_SYNC_RETRY_MAX_ATTEMPTS: ${FESTIVAL_SYNC_RETRY_MAX_ATTEMPTS:-3}
      FESTIVAL_SYNC_RETRY_INITIAL_DELAY: ${FESTIVAL_SYNC_RETRY_INITIAL_DELAY:-1s}
      FESTIVAL_SYNC_RETRY_MAX_DELAY: ${FESTIVAL_SYNC_RETRY_MAX_DELAY:-10s}
      # 매칭 Scheduler. application.yml의 기본값은 false이고 dev 컨테이너는 루트 .env를
      # 읽지 않으므로, 여기서 전달하지 않으면 제안 timeout·노쇼 처리가 기동하지 않는다.
      MATCHING_SCHEDULER_ENABLED: ${MATCHING_SCHEDULER_ENABLED:-true}
      MATCHING_NO_SHOW_SCHEDULER_ENABLED: ${MATCHING_NO_SHOW_SCHEDULER_ENABLED:-true}
      MATCHING_SCHEDULER_FIXED_DELAY: ${MATCHING_SCHEDULER_FIXED_DELAY:-5s}
      MATCHING_STALE_TIMEOUT: ${MATCHING_STALE_TIMEOUT:-30s}
      MATCHING_PROPOSAL_TIMEOUT: ${MATCHING_PROPOSAL_TIMEOUT:-30s}
      MATCHING_SCHEDULER_BATCH_SIZE: ${MATCHING_SCHEDULER_BATCH_SIZE:-20}
      # 두 가중치의 합이 1이 아니면 기동 시점에 실패한다(PairCompatibilityScorer).
      MATCHING_SCORING_JACCARD_WEIGHT: ${MATCHING_SCORING_JACCARD_WEIGHT:-0.70}
      MATCHING_SCORING_EMBEDDING_WEIGHT: ${MATCHING_SCORING_EMBEDDING_WEIGHT:-0.30}
      # 비어 있으면 취향 임베딩 등록이 항상 EMBEDDING_API_FAILED로 실패한다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 비어 있으면 제재 안내에서 문의 문구를 숨긴다.
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:-}
      ADMIN_MEMBER_SUSPENSION_SCHEDULER_ENABLED: ${ADMIN_MEMBER_SUSPENSION_SCHEDULER_ENABLED:-true}
      FESTIVAL_CHECKIN_BYPASS_RADIUS_CHECK: ${FESTIVAL_CHECKIN_BYPASS_RADIUS_CHECK:-true}
    volumes:
      - ../../backend/app.jar:/app/app.jar:ro
      - ../../logs/backend:/app/logs
    expose:
      - "8080"
    networks:
      - meet-or-solo-dev

  nginx:
    image: nginx:1.27-alpine
    container_name: meet-or-solo-nginx-dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "18080:80"
    volumes:
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ../nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../logs/nginx:/var/log/nginx
    networks:
      - meet-or-solo-dev

networks:
  meet-or-solo-dev:
    name: meet-or-solo-dev
