spring:
  application:
    name: meet-or-solo-backend
  profiles:
    default: local
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-context-time-zone: true
  servlet:
    multipart:
      max-file-size: ${PROFILE_IMAGE_MAX_SIZE:5MB}
      max-request-size: ${PROFILE_IMAGE_MAX_SIZE:5MB}

server:
  port: ${SERVER_PORT:8080}

app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENAI_READ_TIMEOUT:10s}
  admin:
    report:
      cursor-hmac-secret: ${ADMIN_REPORT_CURSOR_HMAC_SECRET}
    member:
      suspension-scheduler-enabled: ${ADMIN_MEMBER_SUSPENSION_SCHEDULER_ENABLED:false}
      suspension-scheduler-fixed-delay: ${ADMIN_MEMBER_SUSPENSION_SCHEDULER_FIXED_DELAY:60000}
  matching:
    scoring:
      # 태그 Jaccard 대 임베딩 코사인 유사도 가중치. 두 값의 합은 1이어야 한다.
      jaccard-weight: ${MATCHING_SCORING_JACCARD_WEIGHT:0.70}
      embedding-weight: ${MATCHING_SCORING_EMBEDDING_WEIGHT:0.30}
    scheduler:
      enabled: ${MATCHING_SCHEDULER_ENABLED:false}
      fixed-delay: ${MATCHING_SCHEDULER_FIXED_DELAY:5s}
      stale-timeout: ${MATCHING_STALE_TIMEOUT:30s}
      proposal-timeout: ${MATCHING_PROPOSAL_TIMEOUT:30s}
      batch-size: ${MATCHING_SCHEDULER_BATCH_SIZE:20}
    no-show-scheduler:
      enabled: ${MATCHING_NO_SHOW_SCHEDULER_ENABLED:false}
