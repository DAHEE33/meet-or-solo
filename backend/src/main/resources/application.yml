spring:
  application:
    name: meet-or-solo-backend
  profiles:
    default: local
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-context-time-zone: true
  servlet:
    multipart:
      max-file-size: ${PROFILE_IMAGE_MAX_SIZE:5MB}
      max-request-size: ${PROFILE_IMAGE_MAX_SIZE:5MB}

server:
  port: ${SERVER_PORT:8080}

app:
  tour-api:
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
    service-key: ${TOUR_API_KEY:${TOURISM-API-KEY:}}
    mobile-os: ${TOUR_API_MOBILE_OS:ETC}
    mobile-app: ${TOUR_API_MOBILE_APP:SoloIn}
    connect-timeout: ${TOUR_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOUR_API_READ_TIMEOUT:10s}
